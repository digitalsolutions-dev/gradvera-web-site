name: CI

# Type-safety gate. `astro build` (run by Vercel on every deploy) does NOT
# type-check, so a TS / .astro template error can ship silently. `astro check`
# closes that gap. Build + deploy stay Vercel's job — this is check-only.

on:
  pull_request:
  push:
    branches: [main, staging]

# One run per ref; cancel superseded runs (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: astro check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Chromium only (the harness targets one browser). Browser download is
      # bounded + retried (CDN hiccups). System libs are NOT installed via apt
      # here: the --with-deps apt step stalls on runner images
      # (actions/runner-images#11347; seen on PR #74) and a killed apt-get keeps
      # the lock, so the retry cannot recover. ubuntu-latest already ships
      # Chrome's shared libraries, which is what Playwright's Chromium needs.
      - name: Install Chromium
        run: |
          for attempt in 1 2; do
            timeout 5m npx playwright install chromium && exit 0
            echo "::warning::playwright browser download attempt $attempt timed out or failed"
            sleep 15
          done
          exit 1
      # Best-effort system deps: bounded, never blocks the job. If the runner
      # image ever lacks a library, the e2e step fails with Playwright's explicit
      # "missing libraries" message, which is the signal to revisit this.
      - name: Install system deps (best effort)
        continue-on-error: true
        run: timeout 3m npx playwright install-deps chromium
      # test:e2e builds the site itself and serves dist/client, then runs the
      # specs. CI=1 turns on a retry + the HTML report.
      - name: Run e2e checks
        run: npm run test:e2e
        env:
          CI: '1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
